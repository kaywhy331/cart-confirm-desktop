<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart Confirm Quick add</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <span class="eyebrow">Cart Confirm</span>
        <h1>Quick add</h1>
      </div>
      <button id="refreshButton" class="ghost" type="button">Refresh</button>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Reading this product page…</p>

    <section id="preview" class="preview" hidden>
      <span id="store" class="store"></span>
      <strong id="title"></strong>
      <dl>
        <div><dt>Item ID</dt><dd id="sku"></dd></div>
        <div><dt>Current price</dt><dd id="price"></dd></div>
        <div><dt>Page state</dt><dd id="availability"></dd></div>
      </dl>
      <p id="seller" class="detail"></p>
      <button id="addButton" class="primary" type="button">Add watch mission</button>
      <small>The current retailer price becomes the mission’s maximum unit price. Seller, stock, and price are re-verified before any later action.</small>
    </section>
  </main>
  <script src="quick-add.js"></script>
  <script src="popup.js"></script>
</body>
</html>

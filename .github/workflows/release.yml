name: Signed Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require a verified signed tag matching package.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$packageVersion."
          }
          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          if ($tagRef.object.type -ne "tag") {
            throw "Release tags must be annotated and cryptographically signed."
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($tagRef.object.sha)" | ConvertFrom-Json
          if (-not $tag.verification.verified) {
            throw "GitHub did not verify the release tag signature: $($tag.verification.reason)."
          }
      - name: Require the Windows signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw "WINDOWS_CERTIFICATE must contain a base64 PFX or secure certificate URL."
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD must contain the PFX password."
          }
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npm audit --audit-level=moderate
      - run: npm run dist:win
      - name: Verify Windows signatures and checksums
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem dist -Filter *.exe)
          if ($executables.Count -ne 2) {
            throw "Expected two signed Windows executables; found $($executables.Count)."
          }
          $artifacts = @($executables)
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($artifact.Name) has invalid Authenticode status: $($signature.Status)."
            }
          }
          $checksums = @(Get-Content dist/SHA256SUMS.txt)
          if ($checksums.Count -ne 2) {
            throw "Expected exactly two checksum entries, found $($checksums.Count)."
          }
          $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($line in $checksums) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64})\s{2}(?<name>[^\\/]+\.exe)$') {
              throw "Malformed checksum entry: $line"
            }
            $expectedName = $Matches.name
            if (-not $seen.Add($expectedName)) {
              throw "Duplicate checksum entry for $expectedName."
            }
            $artifact = $artifacts | Where-Object Name -CEQ $expectedName
            if ($null -eq $artifact) {
              throw "Checksum names an unexpected artifact: $expectedName"
            }
            $actual = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches.hash) {
              throw "Checksum mismatch for $($artifact.Name)."
            }
          }
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -Filter *.exe | Sort-Object Name | ForEach-Object FullName)
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "--repo", $env:GITHUB_REPOSITORY,
            "--verify-tag",
            "--generate-notes"
          ) + $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub stable release publication failed."
          }

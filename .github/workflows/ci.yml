name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

# push and pull_request both fire for the same commit whenever that commit is
# also an open PR's head, doubling concurrent runner usage for no benefit.
# Group by the actual commit SHA (pull_request events report a synthetic merge
# SHA in github.sha, so the real pushed commit is github.event.pull_request.head.sha)
# so the second trigger cancels the redundant first one instead of queuing
# alongside it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npm audit --audit-level=moderate

  windows-package:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: cart-confirm-windows-unsigned
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npm audit --audit-level=moderate

  windows-package:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: cart-confirm-windows-unsigned
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

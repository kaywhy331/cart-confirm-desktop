name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Feature work is verified by pull_request and integration work by pushes to
# main. Keeping those triggers mutually exclusive avoids cancelled duplicate
# checks being attached to a PR commit. The concurrency guard still replaces a
# superseded run when newer work reaches the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npm audit --audit-level=moderate

  windows-package:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: cart-confirm-windows-unsigned
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
